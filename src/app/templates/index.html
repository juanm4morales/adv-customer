<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulación de Conversación</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet" />
</head>
<body>
    <header style="text-align:center; padding: 2rem;">
        <h1>🧠 Plataforma de Testing de Bots - Klari</h1>
        <p>⚙️ Simulación Inteligente de Conversación</p>
        <a href="/" id="go-original-root" style="display:inline-block;">Home</a>
    </header>

    <!-- Formulario inicial para ingresar Bot ID y Agent ID -->
    <div id="initial-form-container" class="form-container">
        <form id="initial-form">
            <label for="bot-id">Selecciona un Bot:</label>
            <select id="bot-id" name="bot_id" required style="width: 100%;">
                <option value="" disabled selected>Selecciona un bot</option>
            </select>

            <label for="agent-id">Selecciona un Agente:</label>
            <select id="agent-id" name="agent_id" required style="width: 100%;">
                <option value="" disabled selected>Selecciona un agente</option>
            </select>

            <button type="submit">Obtener Atributos</button>
        </form>
    </div>

    <!-- Contenedor para el formulario dinámico -->
    <div id="dynamic-form-container" class="form-container hidden"></div>

    <!-- Contenedor para el chat -->
    <div id="chat-container" class="chat-container hidden">
        <div id="chat-messages" class="chat-messages">
            <!-- Los mensajes del chat se renderizarán aquí -->
        </div>
    </div>

    <!-- Contenedor para mostrar el resultado -->
    <div id="result-container" class="result-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
    <script type="module" src="/static/js/main.js"></script>
</body>
</html>

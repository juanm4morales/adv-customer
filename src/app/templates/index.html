<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulación de Conversación</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <header style="text-align:center; padding: 2rem;">
        <h1 style="font-size: 2.5rem;">🧠 Simulación de Conversación Inteligente</h1>
        <p style="color: #666;">Adversarial Agent</p>
    </header>

    <!-- Formulario inicial para ingresar Bot ID y Agent ID -->
    <div id="initial-form-container" class="form-container">
        <form id="initial-form">
            <label for="bot-id">ID del Bot:</label>
            <input type="text" id="bot-id" name="bot_id" required>

            <label for="agent-id">ID del Agente:</label>
            <input type="text" id="agent-id" name="agent_id" required>

            <button type="submit">Obtener Atributos</button>
        </form>
    </div>

    <!-- Contenedor para el formulario dinámico -->
    <div id="dynamic-form-container" class="form-container hidden"></div>

    <!-- Contenedor para el chat -->
    <div id="chat-container" class="chat-container hidden">
        <div id="chat-messages" class="chat-messages">
            <!-- Los mensajes del chat se renderizarán aquí -->
        </div>
    </div>

    <!-- Contenedor para mostrar el resultado -->
    <div id="result-container" class="result-container"></div>

    <script src="/static/js/scripts.js"></script>
</body>
</html>
